syntax = "proto3";

// example 是 grpcapi v3 的最小接入面活文档：路由由 google.api.http 声明，
// 策略由 grpcapi.v1.policy 声明；server.New 负责 gRPC + gateway 装配。
package example.echo.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "grpcapi/v1/policy.proto";

option go_package = "github.com/lynx-go/grpcapi/example/echo/v1;echov1";

option (grpcapi.v1.api) = {
  api: "public"
  schema_version: 1
  default_exposure: EXPOSURE_PUBLIC
};

message ShoutRequest {
  string text = 1 [(buf.validate.field).string.max_len = 128];
}

message ShoutResponse {
  string text = 1;
  int32 length = 2;
}

message HearRequest {
  string filter = 1;
}

message HearResponse {
  repeated string lines = 1;
}

message PingRequest {}

message PingResponse {
  string pong = 1;
}

service EchoService {
  option (grpcapi.v1.service) = {
    default_policy: { authenticated: true }
    default_exposure: EXPOSURE_PUBLIC
    label: "end_user"
  };

  // 服务面：admin 角色 OR 带 echoes:write scope 的 API key。
  rpc Shout(ShoutRequest) returns (ShoutResponse) {
    option (google.api.http) = {
      post: "/v1/echo:shout"
      body: "*"
    };
    option (grpcapi.v1.method) = {
      policy: {
        any_of: [
          { roles: ["admin"] },
          { scopes: ["echoes:write"] }
        ]
      }
      label: "server"
    };
  }

  // 终端用户面：回落 service default（authenticated）。
  rpc Hear(HearRequest) returns (HearResponse) {
    option (google.api.http) = {
      get: "/v1/echo"
    };
  }

  // 公共面。
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {
      get: "/v1/echo:ping"
    };
    option (grpcapi.v1.method) = {
      policy: { anonymous: true }
      label: "public"
    };
  }
}
